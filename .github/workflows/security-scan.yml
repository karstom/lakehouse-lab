# .github/workflows/security-scan.yml
# Trivy (filesystem) and TruffleHog (secrets) over the whole repository, V3 and legacy/v2,
# plus a check that no per-install file (settings, secrets, the lab CA) is committed.
name: Security Scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # trivy-action was hijacked on 2026-03-19 (CVE-2026-33634 / GHSA-69fq-xp46-6x23): tags were
      # repointed to a credential stealer and later deleted, which is why the old 0.33.0 tag no longer
      # resolves. Actions are pinned by commit SHA (tags can be moved), and the Trivy binary is pinned
      # too, because malicious Trivy builds v0.69.4-v0.69.6 were published in the same attack.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (verified commit)
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@d73edfb85d79432e3c767c407afdee59c9a34fde  # v3.88.1
        with:
          path: ./

      - name: No per-install files committed (settings, secrets, lab CA)
        run: |
          # v3/.env, v3/.secrets.env and v3/state/ are written by the installer and are
          # git-ignored; the repo is public, so fail if any of them was force-added.
          bad=$(git ls-files -- 'v3/.env' 'v3/.secrets.env' 'v3/state/*' '*.secrets.env' '.env' | grep -v '^legacy/' || true)
          if [ -n "$bad" ]; then
            echo "::error::per-install files are committed:"
            echo "$bad"
            exit 1
          fi
          echo "No per-install files committed."
