# Documentation check: every link in every Markdown file (tests/docs/check-links.sh, with
# mlc_config.json), and the root README's required sections. Run it locally with:
#   bash tests/docs/check-links.sh            # add --offline to skip web links
name: Documentation Check

on:
  push:
    branches: [main, v3]
    paths:
      - "**.md"
      - "mlc_config.json"
      - "tests/docs/**"
      - ".github/workflows/documentation-check.yml"
  pull_request:
    paths:
      - "**.md"
      - "mlc_config.json"
      - "tests/docs/**"
      - ".github/workflows/documentation-check.yml"
  schedule:
    # Weekly, to catch web links that went dead without a change here.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Links in all Markdown files (markdown-link-check)
        run: bash tests/docs/check-links.sh

      - name: Root README has the sections users look for
        if: ${{ !cancelled() }}
        run: |
          missing=0
          for heading in "## Quick start" "## Profiles and memory" "## Services and URLs" \
                         "## AI assist" "## Learning tracks" "## Documentation" "## Coming from V2?"; do
            if ! grep -qxF "$heading" README.md; then
              echo "::error file=README.md::missing section '$heading'"
              missing=1
            fi
          done
          grep -q "v3/install.sh" README.md || { echo "::error file=README.md::quick start must use v3/install.sh"; missing=1; }
          exit "$missing"

      - name: V3 docs exist
        if: ${{ !cancelled() }}
        run: |
          missing=0
          for doc in docs/README.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/ROADMAP.md \
                     docs/CHANGELOG.md docs/CONTRIBUTING.md legacy/README.md; do
            [ -f "$doc" ] || { echo "::error::missing $doc"; missing=1; }
          done
          [ -f docs/MIGRATION.md ] || { echo "::error::missing the migration guide"; missing=1; }
          exit "$missing"
