coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
query.max-memory=1GB
query.max-memory-per-node=512MB

# Behind Caddy: X-Forwarded-Proto=https makes the request "secure" for OAuth2.
http-server.process-forwarded=true
http-server.authentication.type=oauth2
web-ui.authentication.type=oauth2
http-server.authentication.oauth2.issuer=https://auth.${ENV:LAB_DOMAIN}:${ENV:LAB_PORT}/realms/lakehouse
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:TRINO_CLIENT_SECRET}
http-server.authentication.oauth2.scopes=openid,profile
http-server.authentication.oauth2.principal-field=preferred_username
# groups-field is rejected by Trino 483 ('was not used'); group mapping is a Phase 1 item.
# Keycloak is behind Caddy's internal CA; trust its root (PEM) for discovery/JWKS/token calls.
oauth2-jwk.http-client.trust-store-path=/trust/caddy-root.crt
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
