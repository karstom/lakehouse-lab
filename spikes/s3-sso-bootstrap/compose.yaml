# Spike S-3: Keycloak realm import -> SSO for JupyterHub, Superset, Airflow 3, Trino, Lakekeeper.
# Run only through ./dc.sh (project v3-s3, env files: versions, local pins, lab, secrets).
# Only published port: Caddy ${LAB_PORT} (18443). Total mem_limit: ~13.3 GB.

x-trust-env: &trust-env
  SSL_CERT_FILE: /trust/ca-bundle.crt
  REQUESTS_CA_BUNDLE: /trust/ca-bundle.crt
  LAB_DOMAIN: ${LAB_DOMAIN}
  LAB_PORT: ${LAB_PORT}

x-after-trust: &after-trust
  trust-init:
    condition: service_completed_successfully

services:
  caddy:
    image: caddy:${CADDY_VERSION}
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
      LAB_PORT: ${LAB_PORT}
    ports:
      - "${LAB_PORT}:${LAB_PORT}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        # Containers resolve the public hostnames straight to Caddy, so the OIDC issuer
        # URL is byte-identical for browsers and for services.
        aliases:
          - auth.${LAB_DOMAIN}
          - jupyter.${LAB_DOMAIN}
          - superset.${LAB_DOMAIN}
          - airflow.${LAB_DOMAIN}
          - trino.${LAB_DOMAIN}
          - catalog.${LAB_DOMAIN}
    mem_limit: 256m
    cpus: 1

  trust-init:
    image: caddy:${CADDY_VERSION}
    entrypoint: ["/scripts/trust-init.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - caddy_data:/caddy-data:ro
      - trust:/trust
    depends_on:
      - caddy
    mem_limit: 64m
    cpus: 0.5

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD}
    volumes:
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 40
    mem_limit: 1g
    cpus: 2

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.${LAB_DOMAIN}:${LAB_PORT}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70"
      # Placeholders substituted into the realm template at import time:
      LAB_DOMAIN: ${LAB_DOMAIN}
      LAB_PORT: ${LAB_PORT}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD}
      JUPYTERHUB_CLIENT_SECRET: ${JUPYTERHUB_CLIENT_SECRET}
      SUPERSET_CLIENT_SECRET: ${SUPERSET_CLIENT_SECRET}
      AIRFLOW_CLIENT_SECRET: ${AIRFLOW_CLIENT_SECRET}
      TRINO_CLIENT_SECRET: ${TRINO_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-lakehouse.json:/opt/keycloak/data/import/realm-lakehouse.json:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "/scripts/http-ok.sh", "9000", "/health/ready"]
      interval: 5s
      retries: 60
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 2

  jupyterhub:
    build:
      context: ./jupyterhub
      args:
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
        OAUTHENTICATOR_VERSION: ${OAUTHENTICATOR_VERSION}
    image: v3-s3/jupyterhub:${JUPYTERHUB_VERSION}
    environment:
      <<: *trust-env
      JUPYTERHUB_CLIENT_SECRET: ${JUPYTERHUB_CLIENT_SECRET}
    volumes:
      - hub_data:/srv/jupyterhub/data
      - trust:/trust:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD", "python3", "/scripts/py-http-ok.py", "http://localhost:8000/hub/health"]
      interval: 5s
      retries: 30
    depends_on:
      <<: *after-trust
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1

  superset:
    build:
      context: ./superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION}
        AUTHLIB_VERSION: ${AUTHLIB_VERSION}
        PSYCOPG2_BINARY_VERSION: ${PSYCOPG2_BINARY_VERSION}
    image: v3-s3/superset:${SUPERSET_VERSION}
    entrypoint: ["/app/lakehouse/start.sh"]
    environment:
      <<: *trust-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      SUPERSET_CLIENT_SECRET: ${SUPERSET_CLIENT_SECRET}
      SERVER_WORKER_AMOUNT: "2"
    volumes:
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 5s
      retries: 60
      start_period: 30s
    depends_on:
      <<: *after-trust
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2

  airflow-init:
    build: &airflow-build
      context: ./airflow
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
        AIRFLOW_PYTHON: ${AIRFLOW_PYTHON}
        AIRFLOW_PROVIDERS_KEYCLOAK_VERSION: ${AIRFLOW_PROVIDERS_KEYCLOAK_VERSION}
    image: &airflow-image v3-s3/airflow:${AIRFLOW_VERSION}
    entrypoint: ["/opt/lakehouse/init.sh"]
    environment: &airflow-env
      <<: *trust-env
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.keycloak.auth_manager.keycloak_auth_manager.KeycloakAuthManager
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__API__BASE_URL: https://airflow.${LAB_DOMAIN}:${LAB_PORT}/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_ID: airflow
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_SECRET: ${AIRFLOW_CLIENT_SECRET}
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__REALM: lakehouse
      AIRFLOW__KEYCLOAK_AUTH_MANAGER__SERVER_URL: https://auth.${LAB_DOMAIN}:${LAB_PORT}
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - trust:/trust:ro
    depends_on:
      <<: *after-trust
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2

  airflow-api:
    build: *airflow-build
    image: *airflow-image
    command: ["api-server", "--proxy-headers"]
    environment:
      <<: *airflow-env
      KC_ADMIN_USER: ""
      KC_ADMIN_PASSWORD: ""
    volumes:
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/version"]
      interval: 5s
      retries: 60
      start_period: 20s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2

  trino:
    image: trinodb/trino:${TRINO_VERSION}
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
      LAB_PORT: ${LAB_PORT}
      TRINO_CLIENT_SECRET: ${TRINO_CLIENT_SECRET}
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 5s
      retries: 60
      start_period: 20s
    depends_on:
      <<: *after-trust
      keycloak:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    command: ["migrate"]
    environment: &lakekeeper-env
      SSL_CERT_FILE: /trust/ca-bundle.crt
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://lakekeeper:${LAKEKEEPER_DB_PASSWORD}@postgres:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
      LAKEKEEPER__BASE_URI: https://catalog.${LAB_DOMAIN}:${LAB_PORT}
      LAKEKEEPER__OPENID_PROVIDER_URI: https://auth.${LAB_DOMAIN}:${LAB_PORT}/realms/lakehouse
      LAKEKEEPER__OPENID_AUDIENCE: lakekeeper
      LAKEKEEPER__OPENID_SUBJECT_CLAIM: sub
      LAKEKEEPER__UI__OPENID_CLIENT_ID: lakekeeper
      LAKEKEEPER__UI__OPENID_REDIRECT_PATH: /callback
      LAKEKEEPER__UI__ENABLE_SURVEYS: "false"
    volumes:
      - trust:/trust:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1

  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    command: ["serve"]
    environment: *lakekeeper-env
    volumes:
      - trust:/trust:ro
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck", "-s"]
      interval: 5s
      retries: 60
    depends_on:
      <<: *after-trust
      lakekeeper-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1

  # Headless browser test driver. Host-networked so it enters through the published port
  # exactly like a user's browser. Started only by test.sh (profile "test").
  tester:
    profiles: ["test"]
    build:
      context: ./tester
      args:
        PLAYWRIGHT_IMAGE_TAG: ${PLAYWRIGHT_IMAGE_TAG}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION}
    image: v3-s3/tester:${PLAYWRIGHT_VERSION}
    network_mode: host
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN}
      LAB_PORT: ${LAB_PORT}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD}
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - trust:/trust:ro
      - ./out:/out
    mem_limit: 2g
    cpus: 2

volumes:
  caddy_data:
  caddy_config:
  trust:
  pg_data:
  hub_data:
