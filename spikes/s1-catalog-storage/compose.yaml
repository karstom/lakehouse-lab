# Spike S-1 — Lakekeeper + SeaweedFS + Spark 4.1 + Trino (ADR-001/002/003/006)
# Run ONLY as:  docker compose -p v3-s1 --env-file ../versions.env --env-file versions.local.env ...
# No host ports. Every container has mem_limit + cpus (total ~13 GB).
# Secrets are generated by test.sh into secrets/ (never committed). The static S3 keys
# (secrets/s3-admin.env) go ONLY to the one-shot bootstrap container, which creates the SeaweedFS
# identity and hands the keys to Lakekeeper once via its management API (warehouse storage credential).
# Spark and Trino get no S3 keys at all (ADR-006).

name: v3-s1

x-limits-small: &small
  mem_limit: 512m
  cpus: 1

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    <<: *small
    mem_limit: 1g
    env_file: [secrets/pg.env]
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lakekeeper", "-d", "lakekeeper"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    mem_limit: 2g
    cpus: 2
    # all-in-one: master + volume + filer + S3 gateway
    command: ["server", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=256", "-filer", "-s3", "-s3.port=8333",
              "-s3.iam.config=/etc/seaweedfs/iam.json"]
    volumes:
      - seaweed-data:/data
      - ./secrets/seaweedfs-iam.json:/etc/seaweedfs/iam.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    <<: *small
    env_file: [secrets/pg.env]
    environment: &lk-env
      LAKEKEEPER__PG_HOST_R: postgres
      LAKEKEEPER__PG_HOST_W: postgres
      LAKEKEEPER__PG_PORT: "5432"
      LAKEKEEPER__PG_USER: lakekeeper
      LAKEKEEPER__PG_DATABASE: lakekeeper
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    <<: *small
    env_file: [secrets/pg.env]
    environment:
      <<: *lk-env
      RUST_LOG: info,lakekeeper=debug
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}

  # One-shot: S3 identity + bucket in SeaweedFS, bootstrap Lakekeeper, create warehouse.
  bootstrap:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    <<: *small
    env_file: [secrets/s3-admin.env]
    environment:
      WAREHOUSE: lakehouse
      BUCKET: warehouse
      S3_REGION: us-east-1
      STS_ROLE_ARN: arn:aws:iam::role/LakekeeperVended   # defined in seaweedfs/iam.template.json
    volumes: ["./bootstrap:/bootstrap:ro"]
    entrypoint: ["/bootstrap/bootstrap.sh"]
    restart: "no"
    depends_on:
      seaweedfs: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}

  spark-master:
    build: &spark-build
      context: spark
      args:
        SPARK_IMAGE_TAG: ${SPARK_IMAGE_TAG}
        SPARK_VERSION: ${SPARK_VERSION}
        SCALA_BINARY_VERSION: ${SCALA_BINARY_VERSION}
        ICEBERG_VERSION: ${ICEBERG_VERSION}
    image: v3-s1/spark:${SPARK_VERSION}-iceberg${ICEBERG_VERSION}
    mem_limit: 1g
    cpus: 1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    volumes: &spark-conf ["./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro"]

  spark-worker:
    image: v3-s1/spark:${SPARK_VERSION}-iceberg${ICEBERG_VERSION}
    mem_limit: 3g
    cpus: 4
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "4"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes: *spark-conf
    depends_on: [spark-master]

  # One-shot Spark SQL job (driver); run with: compose run --rm spark-job <file.sql>
  spark-job:
    image: v3-s1/spark:${SPARK_VERSION}-iceberg${ICEBERG_VERSION}
    mem_limit: 2g
    cpus: 2
    profiles: [jobs]
    entrypoint: ["/opt/spikes/run-sql.sh"]
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/run-sql.sh:/opt/spikes/run-sql.sh:ro
      - ./sql:/opt/spikes/sql:ro
    depends_on: [spark-master, spark-worker]

  trino:
    image: trinodb/trino:${TRINO_VERSION}
    mem_limit: 4g
    cpus: 4
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./sql:/opt/spikes/sql:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  pg-data:
  seaweed-data:
