# Spike S-2 — DuckDB reads a Spark-written Iceberg table through Lakekeeper using STS-VENDED credentials
# (ADR-006, OQ-1). Builds on S-1: same Lakekeeper + SeaweedFS (STS via -s3.iam.config) + bootstrap,
# copied here so the v3-s1 stack is untouched.
# Run ONLY as:  docker compose -p v3-s2 --env-file ../versions.env --env-file versions.local.env ...
# No host ports. Every container has mem_limit + cpus (total incl. one-shots: 9.5 GB).
# Static S3 keys (secrets/s3-admin.env) go ONLY to the one-shot bootstrap container. Spark and DuckDB get none.

name: v3-s2

x-limits-small: &small
  mem_limit: 512m
  cpus: 1

services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    <<: *small
    mem_limit: 1g
    env_file: [secrets/pg.env]
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lakekeeper", "-d", "lakekeeper"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    mem_limit: 2g
    cpus: 2
    command: ["server", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=256", "-filer", "-s3", "-s3.port=8333",
              "-s3.iam.config=/etc/seaweedfs/iam.json"]
    volumes:
      - seaweed-data:/data
      - ./secrets/seaweedfs-iam.json:/etc/seaweedfs/iam.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    <<: *small
    env_file: [secrets/pg.env]
    environment: &lk-env
      LAKEKEEPER__PG_HOST_R: postgres
      LAKEKEEPER__PG_HOST_W: postgres
      LAKEKEEPER__PG_PORT: "5432"
      LAKEKEEPER__PG_USER: lakekeeper
      LAKEKEEPER__PG_DATABASE: lakekeeper
      LAKEKEEPER__AUTHZ_BACKEND: allowall
      LAKEKEEPER__BASE_URI: http://lakekeeper:8181
      RUST_LOG: info
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  lakekeeper:
    image: quay.io/lakekeeper/catalog:${LAKEKEEPER_VERSION}
    <<: *small
    env_file: [secrets/pg.env]
    environment:
      <<: *lk-env
      RUST_LOG: info,lakekeeper=debug
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}

  # One-shot: S3 identity + bucket in SeaweedFS, bootstrap Lakekeeper, warehouse with sts-enabled profile.
  bootstrap:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    <<: *small
    env_file: [secrets/s3-admin.env]
    environment:
      WAREHOUSE: lakehouse
      BUCKET: warehouse
      S3_REGION: us-east-1
      STS_ROLE_ARN: arn:aws:iam::role/LakekeeperVended   # defined in seaweedfs/iam.template.json
    volumes: ["./bootstrap:/bootstrap:ro"]
    entrypoint: ["/bootstrap/bootstrap.sh"]
    restart: "no"
    profiles: [jobs]
    depends_on:
      seaweedfs: {condition: service_healthy}
      lakekeeper: {condition: service_healthy}

  # One-shot Spark SQL job in local mode (writes the table). Reuses S-1's image (same build definition).
  spark-job:
    build:
      context: ../s1-catalog-storage/spark
      args:
        SPARK_IMAGE_TAG: ${SPARK_IMAGE_TAG}
        SPARK_VERSION: ${SPARK_VERSION}
        SCALA_BINARY_VERSION: ${SCALA_BINARY_VERSION}
        ICEBERG_VERSION: ${ICEBERG_VERSION}
    image: v3-s1/spark:${SPARK_VERSION}-iceberg${ICEBERG_VERSION}
    mem_limit: 3g
    cpus: 2
    profiles: [jobs]
    entrypoint: ["/opt/spikes/run-sql.sh"]
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/run-sql.sh:/opt/spikes/run-sql.sh:ro
      - ./sql:/opt/spikes/sql:ro
    depends_on:
      lakekeeper: {condition: service_healthy}

  # DuckDB client (the thing under test). Idles so the lead can `exec` into it; test scripts are mounted.
  duckdb:
    build:
      context: duckdb
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG}
        DUCKDB_VERSION: ${DUCKDB_VERSION}
    image: v3-s2/duckdb:${DUCKDB_VERSION}
    mem_limit: 2g
    cpus: 2
    command: ["sleep", "infinity"]
    init: true
    volumes: ["./scripts:/opt/s2:ro"]
    depends_on:
      lakekeeper: {condition: service_healthy}


volumes:
  pg-data:
  seaweed-data:
