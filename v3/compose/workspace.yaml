# Workspace (CONTRACT Phase 2; ADR-007): JupyterHub + DockerSpawner behind a docker-socket-proxy,
# and the lakehouse-workspace image it spawns (one container per user, not a compose service).
#
# Docker access (CONTRACT "Docker access"; INV_V3_DOCKER_PROXY_PROJECT_SCOPE):
#   jupyterhub --hub-docker--> docker-guard --docker-api--> docker-proxy --> /var/run/docker.sock
# Only `docker-proxy` mounts the socket; it allows the Docker API METHODS and PATHS DockerSpawner
# uses (config/jupyterhub/docker-proxy.cfg). `docker-guard` (bootstrap/docker_guard.py) is the one
# place request BODIES are checked: strict parse, exact-key allowlist, value checks, and only
# its own re-serialized JSON goes on to Docker. Both networks are internal; `docker-api` has
# only the guard and the proxy. The workspaces JupyterHub starts join only the `lab` network
# and carry the project label + lab.role=workspace.

x-workspace-image: &workspace-image lakehouse-lab/v3-workspace:${JUPYTERHUB_VERSION}
# Per-workspace limits: DockerSpawner applies them, docker-guard refuses a create above them.
# Measured peak with JupyterLab + Trino + DuckDB + PyIceberg + the starter's dbt build:
# ~450 MiB; the default leaves room for code-server.
x-workspace-limits: &workspace-limits
  WORKSPACE_MEM: ${WORKSPACE_MEM:-1536m}
  WORKSPACE_CPUS: ${WORKSPACE_CPUS:-2}

services:
  # One-shot: builds the workspace image with `up --build` (install.sh) and checks it starts.
  # The image is otherwise only used by containers JupyterHub creates.
  workspace-image:
    build:
      context: ./images/workspace
      additional_contexts:
        starter: ./starter
        tracks: ./tracks           # learning tracks (Phase 4), copied to /opt/lakehouse/tracks
      args:
        PYTHON_IMAGE_TAG: ${PYTHON_IMAGE_TAG}
        PYTHON_IMAGE_DIGEST: ${PYTHON_IMAGE_DIGEST}
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
        JUPYTERLAB_VERSION: ${JUPYTERLAB_VERSION}
        IPYKERNEL_VERSION: ${IPYKERNEL_VERSION}
        JUPYSQL_VERSION: ${JUPYSQL_VERSION}
        JUPYTERLAB_GIT_VERSION: ${JUPYTERLAB_GIT_VERSION}
        JUPYTER_SERVER_PROXY_VERSION: ${JUPYTER_SERVER_PROXY_VERSION}
        JUPYTER_AI_VERSION: ${JUPYTER_AI_VERSION}
        PYSPARK_VERSION: ${PYSPARK_VERSION}
        DUCKDB_VERSION: ${DUCKDB_VERSION}
        PYICEBERG_VERSION: ${PYICEBERG_VERSION}
        TRINO_PYTHON_VERSION: ${TRINO_PYTHON_VERSION}
        DBT_CORE_VERSION: ${DBT_CORE_VERSION}
        DBT_TRINO_VERSION: ${DBT_TRINO_VERSION}
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION}
        # Phase 5: only the PIN of Claude Code (never the binary) for `lab-ai install-claude-code`.
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION}
        CLAUDE_CODE_SHA256_LINUX_X64: ${CLAUDE_CODE_SHA256_LINUX_X64}
        CLAUDE_CODE_SHA256_LINUX_ARM64: ${CLAUDE_CODE_SHA256_LINUX_ARM64}
        # MCP servers (Phase 5, images/workspace/mcp)
        DBT_MCP_VERSION: ${DBT_MCP_VERSION}
        MCP_SDK_VERSION: ${MCP_SDK_VERSION}
        SQLGLOT_VERSION: ${SQLGLOT_VERSION}
    image: *workspace-image
    command: ["python", "-c", "import lakehouse"]
    network_mode: none
    restart: "no"
    mem_limit: ${WORKSPACE_IMAGE_MEM:-64m}
    cpus: ${WORKSPACE_IMAGE_CPUS:-0.5}

  docker-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCKET_PROXY_IMAGE_TAG}@${DOCKER_SOCKET_PROXY_IMAGE_DIGEST}
    labels:
      # Recreated by `up` when its bind-mounted config changes (installer/lib.sh lab_config_hashes).
      lab.config-hash: ${LAB_CONFIG_HASH_JUPYTERHUB:-}
    environment:
      DISABLE_IPV6: "1"
      LOG_LEVEL: ${DOCKER_PROXY_LOG_LEVEL:-notice}
      LAB_WS_CONTAINER_PREFIX: ${COMPOSE_PROJECT_NAME:?run install.sh (missing .env)}-ws-
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:?run install.sh (missing .env)}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/jupyterhub/docker-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks: [docker-api]              # reachable only from docker-guard
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${DOCKER_PROXY_MEM:-64m}
    cpus: ${DOCKER_PROXY_CPUS:-0.25}

  # The body policy for JupyterHub's Docker calls (python stdlib, on the bootstrap image). It
  # forwards only DockerSpawner's calls for this project, and only JSON it validated and
  # re-serialized itself; anything else gets 403 and one log line (never a body).
  docker-guard:
    image: lakehouse-lab/v3-bootstrap:${PYTHON_IMAGE_TAG}
    command: ["python3", "-m", "bootstrap.docker_guard"]
    environment:
      <<: *workspace-limits
      LAB_PROJECT: ${COMPOSE_PROJECT_NAME:?run install.sh (missing .env)}
      LAB_WORKSPACE_IMAGE: *workspace-image
      LAB_DOCKER_GUARD_UPSTREAM: docker-proxy:2375
      TZ: ${LAB_TZ:-UTC}
    networks: [hub-docker, docker-api]
    healthcheck:
      # Through the guard and the proxy to the daemon.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:2375/_ping', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      docker-proxy: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: ${DOCKER_GUARD_MEM:-64m}
    cpus: ${DOCKER_GUARD_CPUS:-0.25}

  jupyterhub:
    build:
      context: ./images/jupyterhub
      args:
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
        JUPYTERHUB_IMAGE_DIGEST: ${JUPYTERHUB_IMAGE_DIGEST}
        OAUTHENTICATOR_VERSION: ${OAUTHENTICATOR_VERSION}
        DOCKERSPAWNER_VERSION: ${DOCKERSPAWNER_VERSION}
    image: lakehouse-lab/v3-jupyterhub:${JUPYTERHUB_VERSION}
    labels:
      # Recreated by `up` when its bind-mounted config changes (installer/lib.sh lab_config_hashes).
      lab.config-hash: ${LAB_CONFIG_HASH_JUPYTERHUB:-}
    command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?run install.sh (missing .env)}
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.localhost}
      LAB_AUTH_URL: ${LAB_AUTH_URL:?LAB_AUTH_URL is derived from LAB_DOMAIN/LAB_HTTPS_PORT by installer/lib.sh; start the lab with ./lab or ./install.sh}
      OIDC_CLIENT_SECRET_JUPYTERHUB: ${OIDC_CLIENT_SECRET_JUPYTERHUB:?}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:?}
      <<: *workspace-limits
      DOCKER_HOST: tcp://docker-guard:2375
      LAB_WORKSPACE_IMAGE: *workspace-image
      LAB_TOKEN_MIN_TTL: ${LAB_TOKEN_MIN_TTL:-2700}
      LAB_SPARK_REMOTE: ${LAB_SPARK_REMOTE:-sc://spark-connect:15002}
      # AI assist (Phase 5): at every spawn the hub mints the user's own gateway key through
      # the ai-keys broker (compose/ai.yaml, profile full) with this credential; the hub never
      # holds the gateway's master key. On core/engineer the broker does not exist and
      # workspaces get LAB_AI_STATUS=not-configured.
      LAB_AI_KEYS_URL: ${LAB_AI_KEYS_URL:-http://ai-keys:8080}
      AI_GATEWAY_HUB_TOKEN: ${AI_GATEWAY_HUB_TOKEN:-}
      LAB_AI_CONTEXT_TOKENS: ${LAB_AI_CONTEXT_TOKENS:-}
      TZ: ${LAB_TZ:-UTC}
    volumes:
      - ./config/jupyterhub/jupyterhub_config.py:/etc/jupyterhub/jupyterhub_config.py:ro
      - jupyterhub-data:/srv/jupyterhub/data
      - trust:/trust:ro
      # User DAGs (Phase 4, E3): the hub creates each engineer's own folder here before the
      # spawn, then mounts only that folder into the workspace (jupyterhub_config.py). The
      # hub runs as root in its container; it never writes DAG files.
      - dags-user:/srv/dags-user
    networks: [lab, hub-docker]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/hub/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      docker-guard: {condition: service_healthy}
      workspace-image: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
      caddy: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}    # creates the `jupyterhub` client
      samples: {condition: service_completed_successfully}      # the starter's dbt sources
    # Time to stop every running workspace on `down` (cleanup_servers).
    stop_grace_period: 60s
    restart: unless-stopped
    mem_limit: ${JUPYTERHUB_MEM:-384m}
    cpus: ${JUPYTERHUB_CPUS:-1}

# The `hub-docker` and `docker-api` networks and the `jupyterhub-data` volume are declared in compose.yaml.
