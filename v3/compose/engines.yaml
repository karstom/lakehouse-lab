# Engines: Trino (ADR-003). Iceberg REST catalog = Lakekeeper with vended STS credentials
# (ADR-006 as amended; Trino 483 has no remote signing). No static S3 keys anywhere here.
# Web UI: OAuth2 through Keycloak. Clients: Keycloak-issued JWT bearer tokens.
# Access control: file-based rules + file group provider generated by bootstrap (OQ-17).

services:
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    labels:
      # Recreated by `up` when its bind-mounted config changes (installer/lib.sh lab_config_hashes).
      lab.config-hash: ${LAB_CONFIG_HASH_TRINO:-}
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN:-lab.localhost}
      LAB_HTTPS_PORT: ${LAB_HTTPS_PORT:-443}
      LAB_AUTH_URL: ${LAB_AUTH_URL:?LAB_AUTH_URL is derived from LAB_DOMAIN/LAB_HTTPS_PORT by installer/lib.sh; start the lab with ./lab or ./install.sh}
      OIDC_CLIENT_SECRET_TRINO: ${OIDC_CLIENT_SECRET_TRINO:?}
      TRINO_INTERNAL_SECRET: ${TRINO_INTERNAL_SECRET:?}
      TZ: ${LAB_TZ:-UTC}
    volumes:
      - ./config/trino/config.properties:/etc/trino/config.properties:ro
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./config/trino/group-provider.properties:/etc/trino/group-provider.properties:ro
      # Access rules: GENERATED into trino-groups/rules.json by bootstrap/identity-sync from
      # config/trino/rules.json + each analyst's own dbt_<user> schema (Phase 4).
      - ./config/trino/catalog:/etc/trino/catalog:ro
      - trust:/trust:ro
      - trino-groups:/var/lib/lab/trino-groups:ro
    networks: [lab]
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      caddy: {condition: service_healthy}
      # Trino's Iceberg REST catalog session (client `trino`, refreshed against Keycloak) does
      # not recover when Keycloak or Lakekeeper restarts under it: every catalog call then
      # fails with ICEBERG_CATALOG_ERROR. So compose restarts Trino whenever it updates one of
      # them. `restart: true` is not transitive: when an upgrade recreates postgres, compose
      # restarts postgres's direct dependents (keycloak, lakekeeper, ...) but not Trino, hence
      # the direct postgres entry although Trino never talks to Postgres.
      keycloak: {condition: service_healthy, restart: true}
      lakekeeper: {condition: service_healthy, restart: true}
      postgres: {condition: service_healthy, restart: true}
    restart: unless-stopped
    mem_limit: ${TRINO_MEM:-3g}
    cpus: ${TRINO_CPUS:-2}
