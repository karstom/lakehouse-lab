# Lakehouse Lab V3: top-level compose file (CONTRACT.md). Always started as
#
#   docker compose --project-directory v3 --env-file v3/versions.env --env-file v3/.env \
#     --profile "$LAB_PROFILE" up -d --wait --remove-orphans
#
# Versions come only from versions.env (ADR-012). Non-secret settings come from .env.
# Secrets come from .secrets.env, which each fragment reads through `include.env_file`, so a
# service sees only the secrets its fragment names in `environment:` (never the whole file).
#
# The core services carry no `profiles:` key, so every profile (core and later ones) includes
# them. Profiled services: `smoke` (profile `test`); Spark and Airflow (profiles `engineer` and
# `full`); Superset (profile `full`). `full` = engineer + Superset, so every engineer service
# lists both profiles (compose has no profile inheritance).
#
# Resources declared here, once (INV_VOLUME_NAMES_SINGLE_SOURCE): the networks and every
# named volume. Compose prefixes them with COMPOSE_PROJECT_NAME. No `external: true`.
# The one exception to "volumes only in compose" (CONTRACT Phase 2): per-user home volumes
# ${COMPOSE_PROJECT_NAME}-home-<user>, created by JupyterHub (config/jupyterhub) with the
# project and lab.role=workspace labels; `lab reset` deletes them by those labels.
# The lab CA is NOT a volume: it lives in ${LAB_STATE_DIR}/ca, which `down -v` never touches.

include:
  - path: compose/edge.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/identity.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/storage.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/catalog.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/bootstrap.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/engines.yaml
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/workspace.yaml     # JupyterHub, docker-socket-proxy, workspace image (Phase 2)
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/spark.yaml         # profile engineer: Spark master, worker, Spark Connect
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/airflow.yaml       # profiles engineer/full: Airflow (Phase 3)
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/console.yaml       # every profile: Lab Console, oauth2-proxy forward-auth (Phase 3)
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/superset.yaml      # profile full: Superset (Phase 3)
    project_directory: .
    env_file: [.secrets.env]
  - path: compose/test.yaml
    project_directory: .
    env_file: [.secrets.env]

networks:
  lab: {}
  # Spark's cluster network (profiles engineer/full). Internal (no egress) and never joined by
  # workspaces: the master (7077, UI 8080), the worker (UI 8081) and the Connect driver's RPC,
  # block manager and application UI (4040) listen only here, so a notebook on `lab` cannot open
  # them and the Spark UI is reachable only through Caddy's forward-auth (spark.<LAB_DOMAIN>,
  # engineer and lab-admin). Members: spark-master and spark-worker (only here), spark-connect
  # (also on `lab`, gRPC 15002 for workspaces and Airflow), caddy (proxies the master UI), and
  # what the executors call: keycloak (token endpoint), lakekeeper (catalog + S3 signer),
  # seaweedfs (S3). CONTRACT.md Phase 3, "Networks".
  spark:
    internal: true
  # Only docker-proxy and jupyterhub (compose/workspace.yaml). No egress, not reachable from
  # `lab` or the workspaces.
  hub-docker:
    internal: true

volumes:
  caddy-data: {}       # Caddy's intermediates and leaf certificates (re-issued from the root in state/ca)
  caddy-config: {}
  trust: {}            # ca-bundle.crt (system CAs + lab root), written by trust-init
  postgres-data: {}    # keycloak, lakekeeper and openfga databases
  seaweedfs-data: {}   # object data (the warehouse bucket)
  trino-groups: {}     # Trino file group provider, generated from Keycloak by bootstrap (OQ-17)
  jupyterhub-data: {}  # hub database (users, servers, encrypted auth state) + cookie secret
  airflow-data: {}     # Airflow task logs + executed notebooks (profiles engineer/full)
  dags-user: {}        # user DAGs (Phase 4, E3): rw at ~/airflow-dags in engineer/lab-admin workspaces, ro in Airflow at dags/user/
