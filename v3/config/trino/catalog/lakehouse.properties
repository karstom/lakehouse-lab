# Iceberg REST catalog = Lakekeeper (ADR-002). Storage access: Lakekeeper vends table-scoped
# STS credentials per table load (ADR-006 as amended; Trino 483 cannot remote-sign).
# There are deliberately no s3.aws-access-key / s3.aws-secret-key settings here.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.vended-credentials-enabled=true
# Trino authenticates to Lakekeeper as its own service account (client credentials of the
# Keycloak client "trino"). Per-user rules are enforced in Trino (rules.json).
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.server-uri=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
iceberg.rest-catalog.oauth2.credential=trino:${ENV:OIDC_CLIENT_SECRET_TRINO}
iceberg.rest-catalog.oauth2.scope=openid
# Refresh by client credentials only. With token exchange on (the default), Iceberg first
# tries an RFC 8693 exchange that Keycloak rejects (TOKEN_EXCHANGE_ERROR client_not_found),
# about 2 failed requests per second while Trino is active (Phase 2 finding).
iceberg.rest-catalog.oauth2.token-exchange-enabled=false
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
