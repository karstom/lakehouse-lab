# Lakehouse Lab V3 Trino coordinator (single node). Secrets and host names come from the
# container environment (${ENV:...}); nothing secret is written here.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}

# Behind Caddy: X-Forwarded-Proto=https makes requests "secure", as OAuth2 requires.
http-server.process-forwarded=true

# Web UI: OAuth2 login through Keycloak. API clients: a Keycloak access token as a bearer
# token (validated against the realm's JWKS, audience "trino").
http-server.authentication.type=oauth2
web-ui.authentication.type=oauth2
http-server.authentication.oauth2.issuer=${ENV:LAB_AUTH_URL}/realms/lakehouse
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=${ENV:OIDC_CLIENT_SECRET_TRINO}
http-server.authentication.oauth2.scopes=openid,profile
http-server.authentication.oauth2.principal-field=preferred_username
# The issuer is behind the lab CA; Trino reads the PEM root directly.
oauth2-jwk.http-client.trust-store-path=/trust/root.crt
