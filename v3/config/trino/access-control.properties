# File-based access control. Groups come from the file group provider (group-provider.properties).
# The rules file is GENERATED by bootstrap/identity-sync (bootstrap/trino_groups.py): the static
# config/trino/rules.json plus each analyst's own schema lakehouse.dbt_<user> (Phase 4).
access-control.name=file
security.config-file=/var/lib/lab/trino-groups/rules.json
security.refresh-period=30s
