# Lakehouse Lab V3 Spark defaults (profile `engineer`), mounted read-only into the master,
# the worker and the shared Spark Connect server.
#
# Catalog `lakehouse` = Lakekeeper's Iceberg REST catalog. Storage access is Lakekeeper
# remote signing (ADR-006): S3FileIO asks Lakekeeper to sign every S3 request, so no S3 key
# exists anywhere in Spark.
#
# Identity (OQ-15): this file holds NO catalog credential. Spark Connect gives each client
# its own session, and the client sets the user's own Keycloak access token for its session:
#
#   SparkSession.builder.remote("sc://spark-connect:15002")
#       .config("spark.sql.catalog.lakehouse.token", <user's access token>).getOrCreate()
#
# Lakekeeper then authorizes the real user (OpenFGA grants from Keycloak groups), for the
# catalog calls and for every signed S3 request. A session without a token cannot load the
# catalog at all. Never add `spark.sql.catalog.lakehouse.credential` here: every Connect
# user would then act as that service identity.

spark.sql.extensions                                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                               lakehouse
spark.sql.catalog.lakehouse                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                       rest
spark.sql.catalog.lakehouse.uri                        http://lakekeeper:8181/catalog
spark.sql.catalog.lakehouse.warehouse                  lakehouse
spark.sql.catalog.lakehouse.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation  remote-signing
# No table-metadata cache: a session sees commits from other sessions and engines (Trino,
# DuckDB, other users) on its next query, not up to 30 s later.
spark.sql.catalog.lakehouse.cache-enabled              false
# The session's token is used as-is until it expires. Iceberg could only "refresh" it by an
# RFC 8693 token exchange without client credentials, which Keycloak rejects
# (TOKEN_EXCHANGE_ERROR client_not_found), so refresh is off: a client whose token expired
# opens a new session with a fresh token (the workspace's lab_token()).
spark.sql.catalog.lakehouse.rest.auth.type             oauth2
spark.sql.catalog.lakehouse.token-refresh-enabled      false
spark.sql.catalog.lakehouse.oauth2-server-uri          http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token

# Spark Connect server: gRPC on the lab network only (never published, no Caddy route).
spark.connect.grpc.binding.port                        15002
# Executors on the worker reach the driver inside the spark-connect container, over the
# internal `spark` network. spark.driver.bindAddress is NOT set here: start-spark.sh sets it
# (and SPARK_LOCAL_IP, which the application UI binds to) to spark-connect's `spark` address,
# so the driver RPC, block manager and UI 4040 never listen on `lab` (CONTRACT Phase 3).
spark.driver.host                                      spark-connect
spark.executor.cores                                   2

# Sessions of different users share the driver and executor JVMs, which hold each session's
# token in memory. User code (Python UDFs) runs as the same uid next to them, so the JVM
# attach API (jcmd heap dumps) is disabled.
spark.driver.extraJavaOptions                          -XX:+DisableAttachMechanism
spark.executor.extraJavaOptions                        -XX:+DisableAttachMechanism

spark.ui.showConsoleProgress                           false
# Keep tokens out of the UI and logs (Spark's default regex plus bearer headers).
spark.redaction.regex                                  (?i)secret|password|token|access[.]?key|authorization|credential

# The master UI proxies the worker and application UIs under /proxy/<id>/, so every link works
# through spark.<LAB_DOMAIN> (Caddy + oauth2-proxy forward-auth, engineer and lab-admin only);
# the internal UI ports stay unpublished.
spark.ui.reverseProxy                                  true
# Nobody kills stages, jobs, applications or drivers from a UI (master, worker, application):
# the Connect driver is shared by every user's session.
spark.ui.killEnabled                                   false
