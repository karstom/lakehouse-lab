# Docker API path allowlist of the socket proxy (CONTRACT "Docker access"). Mounted over the
# docker-socket-proxy image's template; its entrypoint substitutes ${BIND_CONFIG}, and HAProxy
# expands "${LAB_WS_CONTAINER_PREFIX}" / "${LAB_PROJECT}" from the environment (double quotes only).
#
# Topology: jupyterhub -> docker-guard (hub-docker) -> THIS proxy (docker-api) -> socket.
# Only docker-guard can reach this proxy (docker-api is internal and has just the two of them).
# The guard (bootstrap/docker_guard.py) is the single source of the request-BODY policy: it
# parses each body strictly, validates every key and value, and forwards only the canonical
# JSON it re-serialized. This file checks METHOD and PATH only: no body rules. (HAProxy
# regexes over raw JSON were bypassable: Docker matches keys case-insensitively, decodes \u
# escapes and keeps the last duplicate key; REG_V3_DOCKER_PROXY_BODY_REGEX_BYPASS.)
#
# The image's own switches (CONTAINERS=1 + POST=1) would allow every container, image,
# volume and network operation on the host's daemon, which also runs other workloads. This
# file allows exactly the paths DockerSpawner uses:
#   read:   _ping, version; one image by name; a <project>-home-* volume; a <project>-ws-*
#           container (no listing)
#   write:  create (name <project>-ws-*), start, stop and remove a <project>-ws-* container;
#           create a volume (the guard allows only <project>-home-<user>)
# Containers are matched by NAME only (the hub's spawner never uses ids), because Docker
# also accepts ids and unique id prefixes, which would reach any container on the daemon.
# Refused: listing, exec, image pull/build/delete, network calls, volume delete.

global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    # One thread: HAProxy otherwise starts one per host CPU (tens of MiB on a big host).
    nbthread 1
    maxconn 200
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    maxconn 100
    load-server-state-from-file global

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}

    acl api_ping      path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$
    acl ctr_inspect   path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9-]+/json\$"
    acl img_inspect   path,url_dec -m reg -i ^(/v[0-9.]+)?/images/[a-zA-Z0-9_./:@-]+/json$
    acl vol_inspect   path,url_dec -m reg "^(/v[0-9.]+)?/volumes/${LAB_PROJECT}-home-[a-z0-9-]+\$"
    acl ctr_create    path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create$
    acl ctr_lifecycle path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9-]+/(start|stop)\$"
    acl ctr_one       path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9-]+\$"
    acl vol_create    path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/create$
    acl ws_name       urlp(name) -m beg "${LAB_WS_CONTAINER_PREFIX}"
    http-request allow if METH_GET api_ping
    http-request allow if METH_GET ctr_inspect
    http-request allow if METH_GET img_inspect
    http-request allow if METH_GET vol_inspect
    http-request allow if METH_POST ctr_create ws_name
    http-request allow if METH_POST ctr_lifecycle
    http-request allow if METH_DELETE ctr_one
    http-request allow if METH_POST vol_create
    http-request deny
    default_backend dockerbackend
