# Docker API allowlist for JupyterHub's DockerSpawner (CONTRACT Phase 2, "Docker access").
# Mounted over the docker-socket-proxy image's template; its entrypoint substitutes
# ${BIND_CONFIG}, and HAProxy expands "${LAB_WS_CONTAINER_PREFIX}" from the environment.
#
# The image's own switches (CONTAINERS=1 + POST=1) would allow every container, image,
# volume and network operation on the host's daemon, which also runs other workloads. This
# file allows exactly what DockerSpawner uses, and nothing else:
#   read:   _ping, version; one image, volume or network by name (no listing); a
#           <project>-ws-* container
#   write:  create, start, stop and remove a container NAMED <project>-ws-* that uses only
#           this project's home/trust volumes and lab network; create a <project>-home-* volume
# Containers are matched by NAME only (the hub's spawner never uses ids), because Docker
# also accepts ids and unique id prefixes, which would reach any container on the daemon.
# Refused: listing, exec, image pull/build/delete, volume and network delete/connect, and
# container creation with a host bind mount, privileged mode, added capabilities, devices or
# the host's network/pid namespace (request-body checks; defence in depth, not a sandbox).

global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    # One thread: HAProxy otherwise starts one per host CPU (tens of MiB on a big host).
    nbthread 1
    maxconn 200
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    maxconn 100
    load-server-state-from-file global

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}
    option http-buffer-request

    acl api_ping      path,url_dec -m reg -i ^(/v[0-9.]+)?/(_ping|version)$
    acl ctr_inspect   path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9_.-]+/json\$"
    acl img_inspect   path,url_dec -m reg -i ^(/v[0-9.]+)?/images/[a-zA-Z0-9_./:@-]+/json$
    acl vol_inspect   path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/[a-zA-Z0-9_.-]+$
    acl net_inspect   path,url_dec -m reg -i ^(/v[0-9.]+)?/networks/[a-zA-Z0-9_.-]+$
    acl ctr_create    path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/create$
    acl ctr_lifecycle path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9_.-]+/(start|stop)\$"
    acl ctr_one       path,url_dec -m reg "^(/v[0-9.]+)?/containers/${LAB_WS_CONTAINER_PREFIX}[a-z0-9_.-]+\$"
    acl vol_create    path,url_dec -m reg -i ^(/v[0-9.]+)?/volumes/create$
    acl ws_name       urlp(name) -m beg "${LAB_WS_CONTAINER_PREFIX}"
    # Dangerous container settings (Docker's JSON field names).
    acl body_hostbind req.body -m reg '"Binds"[[:space:]]*:[[:space:]]*[[][^]]*"/'
    acl body_hostmnt  req.body -m reg '"Type"[[:space:]]*:[[:space:]]*"bind"'
    acl body_priv     req.body -m reg -i '"Privileged"[[:space:]]*:[[:space:]]*true'
    acl body_capadd   req.body -m reg '"CapAdd"[[:space:]]*:[[:space:]]*[[][[:space:]]*"'
    acl body_devices  req.body -m reg '"Devices"[[:space:]]*:[[:space:]]*[[][[:space:]]*[{]'
    acl body_hostns   req.body -m reg -i '"(NetworkMode|PidMode|IpcMode|UsernsMode)"[[:space:]]*:[[:space:]]*"host"'

    # Double quotes: HAProxy expands ${LAB_PROJECT} only inside double quotes.
    # Scope of what a workspace container may use (allowlist, verifier follow-up #1): named
    # volumes only <project>-home-* and <project>_trust; network only <project>_lab; no
    # Mounts, VolumesFrom or extra EndpointsConfig; volumes created only as <project>-home-*.
    # Without this the hub could mount any volume on the host (another project's database).
    acl body_bind_foreign req.body -m reg "\"Binds\"[[:space:]]*:[[:space:]]*[[](?:[[:space:]]*\"(?:${LAB_PROJECT}-home-[a-z0-9_.-]+|${LAB_PROJECT}_trust):[^\"]*\"[[:space:]]*,)*[[:space:]]*\"(?!(?:${LAB_PROJECT}-home-[a-z0-9_.-]+|${LAB_PROJECT}_trust):)"
    acl body_mounts       req.body -m reg "\"Mounts\"[[:space:]]*:[[:space:]]*[[][[:space:]]*[{]"
    acl body_volfrom      req.body -m reg "\"VolumesFrom\"[[:space:]]*:[[:space:]]*[[][[:space:]]*\""
    acl body_endpoints    req.body -m reg "\"EndpointsConfig\"[[:space:]]*:[[:space:]]*[{][[:space:]]*\""
    acl body_net_lab      req.body -m reg "\"NetworkMode\"[[:space:]]*:[[:space:]]*\"${LAB_PROJECT}_lab\""
    acl body_vol_home     req.body -m reg "\"Name\"[[:space:]]*:[[:space:]]*\"${LAB_PROJECT}-home-[a-z0-9_.-]+\""
    http-request allow if METH_GET api_ping
    http-request allow if METH_GET ctr_inspect
    http-request allow if METH_GET img_inspect
    http-request allow if METH_GET vol_inspect
    http-request allow if METH_GET net_inspect
    http-request deny  if METH_POST ctr_create body_hostbind || METH_POST ctr_create body_hostmnt || METH_POST ctr_create body_priv || METH_POST ctr_create body_capadd || METH_POST ctr_create body_devices || METH_POST ctr_create body_hostns
    http-request deny  if METH_POST ctr_create body_bind_foreign || METH_POST ctr_create body_mounts || METH_POST ctr_create body_volfrom || METH_POST ctr_create body_endpoints
    http-request deny  if METH_POST ctr_create !body_net_lab
    http-request allow if METH_POST ctr_create ws_name
    http-request allow if METH_POST ctr_lifecycle
    http-request allow if METH_DELETE ctr_one
    http-request allow if METH_POST vol_create body_vol_home
    http-request deny
    default_backend dockerbackend
